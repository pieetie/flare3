<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flare3</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <nav>
      <a href="index.html" class="active">flare</a>
      <a href="multiplex.html">multiplex</a>
    </nav>
    <p id="status">Initializing…</p>

    <form id="form">
      <label>Left primer
        <textarea id="left" rows="1" spellcheck="false"></textarea>
      </label>
      <label>Right primer
        <textarea id="right" rows="1" spellcheck="false"></textarea>
      </label>
      <label>Probe
        <textarea id="probe" rows="1" spellcheck="false"></textarea>
      </label>
      <input id="threshold" type="hidden" value="-4">
      <button id="run" type="submit" disabled>Analyze</button>
    </form>

    <div id="results"></div>
  </main>

  <script src="js/persist.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.0/full/pyodide.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
