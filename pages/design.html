<div id="design-page">
  <p class="page-intro">Primer3 design (left/right primer + probe)</p>
  <p id="design-status">Loading primer3…</p>

  <form id="design-form">
    <div class="seg" id="design-mode" role="group" aria-label="Parameters">
      <button type="button" data-mode="custom">flare custom</button>
      <button type="button" class="btn-secondary" data-mode="default">primer3 default</button>
    </div>

    <label>Template sequence (5'→3')
      <div class="hl-wrap">
        <div class="hl-backdrop" id="design-seq-bd" aria-hidden="true"></div>
        <textarea id="design-seq" rows="6" spellcheck="false"></textarea>
      </div>
    </label>
    <div class="design-row">
      <label class="bp-field">Breakpoint (j)
        <input id="design-breakpoint" type="number" min="1" step="1" spellcheck="false">
      </label>
      <label class="grow">Excluded region(s) - optional, format start,length (e.g. 101,3)
        <input id="design-excluded" type="text" spellcheck="false">
      </label>
      <label class="delta-field">ΔG
        <input id="design-delta" type="number" step="0.1" value="-4">
      </label>
    </div>
    <div class="actions">
      <button id="design-run" type="button" disabled>Design</button>
    </div>
  </form>

  <div id="design-results"></div>
</div>
